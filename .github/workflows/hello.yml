name: Hello World

# Triggers
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    
# jobs
jobs:
  hello:
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Hello World
        run: echo "Hello World"
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: List Directory of Runner
        run: ls -la
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
          uses: docker/build-push-action@v6
          with:
          context: .
          file: ./WebApplication2/PipelineProcessor.API/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}